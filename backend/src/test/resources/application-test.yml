spring:
  datasource:
    url: jdbc:h2:mem:archat;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password:

archat:
  webhook:
    segredo: segredo-de-teste
  # testes nunca usam a Z-API real, mesmo com um .env local configurado
  envio:
    provedor: simulado
  fila:
    workers: 1
    intervalo-entre-envios: 0ms
    atraso-confirmacao-entrega: 100ms
  envio-simulado:
    atraso-minimo: 0ms
    atraso-maximo: 0ms
    taxa-falha: 0
